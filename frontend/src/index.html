<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Candela Motors</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Candela Motors, concesionario de motos Honda, Kawasaki y Yamaha"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      try {
        if (localStorage.getItem('cm-tema') === 'claro') document.documentElement.setAttribute('data-theme', 'light');
        var marca = localStorage.getItem('cm-brand');
        if (marca === 'honda' || marca === 'kawasaki' || marca === 'yamaha') document.documentElement.setAttribute('data-brand', marca);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
