services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: backend/.env
    environment:
      ALMACENAMIENTO: sqlite
      DATABASE_URL: sqlite:///./data/concesionario.db
    volumes:
      - sqlite_data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
